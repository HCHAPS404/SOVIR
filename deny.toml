# cargo-deny configuration for SOVIR supply-chain gate.
# Audit dependency licenses, security advisories, duplicates and sources.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[bans]
# Warn rather than deny duplicates: the workspace is young; tighten once the graph settles.
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are linked by path without a registry version (normal monorepo pattern).
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "MIT-0",
  # webpki-roots (rustls chain): permissive data license.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
