[workspace]
resolver = "2"
members = [
  "crates/sovir-domain",
  "crates/sovir-ports",
  "crates/sovir-application",
  "crates/sovir-inference",
  "crates/sovir-adapters",
  "crates/sovir-persistence",
  "services/api",
  "services/migrations",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
