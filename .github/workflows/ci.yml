name: SOVIR Scaffold Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify architectural scaffold
        run: python3 scripts/harness.py check
      - name: Verify frontend design scaffold
        run: python3 scripts/design_harness.py
      - name: Verify synthetic fixture contracts
        run: python3 scripts/harness.py eval
  extension-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install extension deps
        run: pnpm install --filter @sovir/extension --frozen-lockfile
      - name: Extractor unit tests (jsdom)
        run: pnpm --filter @sovir/extension test
      - name: Syntax-check extension sources
        run: |
          for f in apps/extension/*.js; do node --check "$f" || exit 1; done
      - name: Validate manifest shape and observer permissions
        run: |
          node -e "
            const m = require('./apps/extension/manifest.json');
            const fail = (w) => { console.error('manifest:', w); process.exit(1); };
            if (m.manifest_version !== 3) fail('must be MV3');
            const p = m.permissions ?? [];
            if (!p.includes('scripting')) fail('needs scripting for opt-in injection');
            if (!(m.host_permissions ?? []).includes('http://127.0.0.1:8787/*')) fail('loopback host missing');
            if (!(m.optional_host_permissions ?? []).length) fail('per-site opt-in origins missing');
            console.log('manifest OK');
          "
  # Remaining native jobs (Android, iOS, macOS) still deferred by toolchain.
  # Never mark them green by executing echo "pass".
