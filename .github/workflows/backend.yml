name: SOVIR Backend Gate
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'services/**'
      - 'infra/postgres/**'
      - 'packages/contracts/**'
      - 'tests/backend/**'
      - 'tests/fixtures/**'
      - 'scripts/backend_harness.py'
      - 'scripts/contract_check.py'
      - 'deny.toml'
      - '.gitleaks.toml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'services/**'
      - 'infra/postgres/**'
      - 'packages/contracts/**'
      - 'tests/backend/**'
      - 'tests/fixtures/**'
      - 'scripts/backend_harness.py'
      - 'scripts/contract_check.py'
      - 'deny.toml'
      - '.gitleaks.toml'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Rust workspace, architectural boundaries, contracts, tests
        env:
          SOVIR_BACKEND_REQUIRE_RUST: '1'
        run: python3 scripts/backend_harness.py
      - name: End-to-end smoke on ephemeral loopback API
        env:
          SOVIR_ENV: test
        run: |
          cargo run -p sovir-api &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/health/live >/dev/null && break
            sleep 2
          done
          python3 scripts/backend_demo.py

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sovir_dev
          POSTGRES_PASSWORD: ci_ephemeral_local_only
          POSTGRES_DB: sovir_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovir_dev -d sovir_dev"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://sovir_dev:ci_ephemeral_local_only@localhost:5432/sovir_dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply migrations to ephemeral Postgres
        run: cargo run -p sovir-migrations -- apply
      - name: Revert all migrations (rollback path)
        run: cargo run -p sovir-migrations -- revert
      - name: Re-apply migrations (idempotent forward path)
        run: cargo run -p sovir-migrations -- apply
      - name: Verify tenant RLS denies cross-tenant access (sovir_app)
        env:
          APP_URL: postgres://sovir_app:sovir_app_dev_only@localhost:5432/sovir_dev
        run: |
          set -euo pipefail
          # Seed two tenants as the migration owner (bypasses RLS).
          psql "$DATABASE_URL" -c "
            INSERT INTO consent_grants
              (tenant_id, grant_id, principal_id, device_id, source_id, expires_at_ms, revoked)
            VALUES
              ('tenant-a','g-a','p-1','d-1','src',9999999999999,false),
              ('tenant-b','g-b','p-2','d-2','src',9999999999999,false);"
          # sovir_app with tenant-a sees only tenant-a rows.
          test "$(psql "$APP_URL" -Atqc "SET app.tenant_id='tenant-a'; SELECT count(*) FROM consent_grants")" = "1"
          # tenant-b sees only its own row.
          test "$(psql "$APP_URL" -Atqc "SET app.tenant_id='tenant-b'; SELECT count(*) FROM consent_grants")" = "1"
          # No tenant set => fail closed, zero rows.
          test "$(psql "$APP_URL" -Atqc "SELECT count(*) FROM consent_grants")" = "0"
          # Insert into another tenant is rejected by WITH CHECK.
          if psql "$APP_URL" -qc "SET app.tenant_id='tenant-a';
             INSERT INTO consent_grants (tenant_id, grant_id, principal_id, device_id, source_id, expires_at_ms, revoked)
             VALUES ('tenant-b','g-evil','p-2','d-2','src',9999999999999,false);" 2>/dev/null; then
            echo "RLS WITH CHECK did not reject cross-tenant insert"; exit 1
          fi
          # Phase-3 tables are subject to the same tenant_isolation policy:
          # audit_events (0009), inference_budget + intel_indicators (0010).
          psql "$DATABASE_URL" -qc "INSERT INTO audit_events
              (audit_id, tenant_id, principal_id, action, detail, at_ms)
              VALUES ('au-a','tenant-a','p-1','session_issued','',1),
                     ('au-b','tenant-b','p-2','session_issued','',1);
              INSERT INTO intel_indicators
              (indicator_id, tenant_id, kind, value, confidence_bp, provenance, at_ms)
              VALUES ('i-a','tenant-a','domain','a.example.com',9000,'fixture',1),
                     ('i-b','tenant-b','domain','b.example.com',9000,'fixture',1);
              INSERT INTO inference_budget (tenant_id, spent_micro_usd, cap_micro_usd)
              VALUES ('tenant-a',0,1000),('tenant-b',0,1000);"
          test "$(psql "$APP_URL" -Atqc "SET app.tenant_id='tenant-a'; SELECT count(*) FROM audit_events")" = "1"
          test "$(psql "$APP_URL" -Atqc "SET app.tenant_id='tenant-a'; SELECT count(*) FROM intel_indicators")" = "1"
          test "$(psql "$APP_URL" -Atqc "SET app.tenant_id='tenant-a'; SELECT count(*) FROM inference_budget")" = "1"
          test "$(psql "$APP_URL" -Atqc "SELECT count(*) FROM audit_events")" = "0"
          test "$(psql "$APP_URL" -Atqc "SELECT count(*) FROM intel_indicators")" = "0"
          test "$(psql "$APP_URL" -Atqc "SELECT count(*) FROM inference_budget")" = "0"
          echo "PASS: tenant RLS verified for sovir_app"
      - name: Durable-adapter smoke (Postgres-backed API)
        env:
          SOVIR_ENV: test
        run: |
          cargo run -p sovir-api &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/health/ready >/dev/null && break
            sleep 2
          done
          python3 scripts/backend_demo.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate OpenAPI, JSON Schema and synthetic fixtures
        # Dependencies are pinned in the script's PEP 723 header.
        run: uv run scripts/contract_check.py --self-test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny and cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: License, ban and source policy
        run: cargo deny check
      - name: RustSec advisory audit
        run: cargo audit

  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile workspace on ${{ matrix.os }}
        run: cargo build --workspace

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run in-memory ingest benchmark
        run: cargo bench -p sovir-application --bench ingest -- --noplot
      - name: Upload criterion results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-ingest
          path: target/criterion/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Report-only for now — no threshold gate until the baseline is known.
      - name: Workspace coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Coverage summary
        run: cargo llvm-cov report --workspace --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          GITLEAKS_ENABLE_COMMENTS: 'false'
