# Optional local PostgreSQL sandbox. No database adapter is connected yet.
# Do not expose postgres to the public internet or store production personal data.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sovir_dev
      POSTGRES_PASSWORD: ${SOVIR_POSTGRES_DEV_PASSWORD:?set SOVIR_POSTGRES_DEV_PASSWORD}
      POSTGRES_DB: sovir_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sovir_db_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovir_dev -d sovir_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  sovir_db_dev:
