<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SOVIR</title>
    <link rel="stylesheet" href="extension.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main>
      <p class="brand-lockup"><span class="mark" aria-hidden="true"></span><span class="brand-name">SOVIR</span></p>
      <div class="theme-switch" role="group" aria-label="Tema">
        <button type="button" data-theme-choice="light">Claro</button>
        <button type="button" data-theme-choice="dark">Oscuro</button>
      </div>
      <p class="note">Sin observación de sitios.</p>
      <h1>Sin observación</h1>
      <p id="status">No hay permiso de sitio. La extensión no lee páginas.</p>
      <button id="pause" type="button">Pausar</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
