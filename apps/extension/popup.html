<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="extension.css" />
    <script src="theme.js"></script>
    <title>SOVIR</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-head">
        <span class="brand-lockup"><span class="mark" aria-hidden="true"></span><span class="brand-name">SOVIR</span></span>
      </header>
      <p class="kicker">Estado</p>
      <p id="api" class="status"><span class="dot" aria-hidden="true"></span><span class="status-text">API: comprobando…</span></p>
      <p id="site" class="status"><span class="dot" aria-hidden="true"></span><span class="status-text">Este sitio: sin observar</span></p>
      <div class="popup-actions">
        <button id="observe" type="button">Observar este sitio</button>
        <button id="pause" type="button" class="ghost">Pausar todo</button>
      </div>
      <ul id="granted" class="granted-list"></ul>
      <p id="last" class="note"></p>
      <p id="verdict" class="note"></p>
      <p id="decision" class="note"></p>
      <p id="error" class="note error" role="alert"></p>
      <p class="note popup-foot">
        La observación extrae señales tipadas (nunca contenido), corre solo en sitios concedidos y
        persiste hasta que revocas el origen aquí o el grant en la consola.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
