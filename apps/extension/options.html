<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Opciones SOVIR</title>
    <link rel="stylesheet" href="extension.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main style="width: min(640px, 100%)">
      <p class="brand-lockup"><span class="mark" aria-hidden="true"></span><span class="brand-name">SOVIR</span></p>
      <div class="theme-switch" role="group" aria-label="Tema">
        <button type="button" data-theme-choice="light">Claro</button>
        <button type="button" data-theme-choice="dark">Oscuro</button>
      </div>
      <p class="note">Permisos de sitio opcionales. No hay dominios vigilados.</p>
      <h1>Opciones</h1>
      <p>Los permisos de sitio son opcionales y no están concedidos. No hay lista de dominios vigilados.</p>
      <p>La pausa del popup afecta solo a este navegador y no envía datos.</p>
    </main>
  </body>
</html>
