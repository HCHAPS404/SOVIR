<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Panel SOVIR</title>
    <link rel="stylesheet" href="extension.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main style="width: min(420px, 100%)">
      <p class="brand-lockup"><span class="mark" aria-hidden="true"></span><span class="brand-name">SOVIR</span></p>
      <div class="theme-switch" role="group" aria-label="Tema">
        <button type="button" data-theme-choice="light">Claro</button>
        <button type="button" data-theme-choice="dark">Oscuro</button>
      </div>
      <p class="note">Sintético. Panel vacío.</p>
      <h1>Nada que investigar</h1>
      <p>No hay eventos de este sitio. Vacío no significa protegido. El panel no repite la consola.</p>
    </main>
  </body>
</html>
