<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Caso 11 — Credencial cortés</title>
<style>body{font-family:sans-serif;max-width:480px;margin:2rem auto;color:#333}
.card{border:1px solid #ddd;padding:2rem;border-radius:8px}</style></head>
<body>
<!-- TRAINING CASE 11 — polite phishing: no urgency, no scary words,
     just a courteous credential ask. Expected:
     [CREDENTIAL_REQUEST, IDENTITY_UNVERIFIED] -> warn / high.
     Detection is structural: a password form on unverified http is
     risky even when the copy is perfectly calm. -->
<div class="card">
<h1>Banca en línea</h1>
<p>Bienvenido de nuevo. Ingrese sus datos para continuar con su sesión.</p>
<form action="/session" method="post">
  <label>Usuario: <input type="text" name="u"></label>
  <label>Contraseña: <input type="password" name="p"></label>
  <button type="submit">Ingresar</button>
</form>
<p style="font-size:12px">Si tiene dudas, consulte la sección de ayuda.</p>
</div>
</body></html>
