<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Caso 04 — Login en HTTP</title>
<style>body{font-family:sans-serif;max-width:480px;margin:2rem auto;color:#333}</style></head>
<body>
<!-- TRAINING CASE 04 — credential form on plain http. Expected:
     [CREDENTIAL_REQUEST, IDENTITY_UNVERIFIED] -> compounded_sensitive_request
     -> warn / high. On https the same form alone would only reach review. -->
<h1>Intranet del taller</h1>
<form action="/login" method="post">
  <label>Usuario: <input type="text" name="user"></label>
  <label>Contraseña: <input type="password" name="pass"></label>
  <button type="submit">Entrar</button>
</form>
</body></html>
