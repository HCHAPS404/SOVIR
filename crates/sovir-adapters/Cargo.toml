[package]
name = "sovir-adapters"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
[dependencies]
sovir-domain = { path = "../sovir-domain" }
sovir-ports = { path = "../sovir-ports" }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1.92"
reqwest.workspace = true
jsonwebtoken = "=9.3.1"
uuid = { version = "1", features = ["v4"] }
# Optional ONNX runtime (feature `onnx`) — ADR-0024 licensed artifacts only.
ort = { version = "2.0.0-rc.10", optional = true }
# unstable_wasm drops `onig` (oniguruma links static CRT and collides
# with msvcprt on Windows — LNK1169); esaxx_fast is dropped too (its
# `cpp` feature compiles C++ with the same CRT clash). Pure-Rust
# fancy-regex + standard unigram path — same tokenizer.json contract.
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["unstable_wasm"] }
# Council voter hard-bound: `tokio::time::timeout` around assess calls.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
# ADR-0024/0025: the ONNX runtime for OnnxVisualVoter/OnnxTextVoter.
# Off by default — voters fail closed without it. `ort` downloads the
# ONNX Runtime binaries at build; `tokenizers` loads HF tokenizer.json.
onnx = ["dep:ort", "dep:tokenizers"]
